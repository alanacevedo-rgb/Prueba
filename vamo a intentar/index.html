<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIANA ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #2b0a1f, #0b0610);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .scene {
      position: absolute;
      text-align: center;
      transition: opacity 2s ease;
    }

    /* Letras individuales */
    .single-letter {
      font-size: 120px;
      font-weight: 700;
      letter-spacing: 10px;
      opacity: 0;
      animation: fadeInOut 1.1s forwards;
      color: #ff9acb;
      text-shadow: 0 0 25px rgba(255, 105, 180, 0.7);
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.85); }
      30% { opacity: 1; transform: scale(1.05); }
      70% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.15); }
    }

    /* Nombre completo */
    .name {
      font-size: 76px;
      font-weight: 600;
      letter-spacing: 8px;
      opacity: 0;
      color: #ffd1e8;
      text-shadow: 0 0 30px rgba(255, 105, 180, 0.8);
      transition: opacity 2s ease;
    }

    /* Escena final */
    .final {
      position: absolute;
      opacity: 0;
      text-align: center;
      max-width: 900px;
      padding: 0 20px;
      transition: opacity 2s ease;
    }

    .big-heart {
      width: 160px;
      height: 160px;
      background: #ff4d8d;
      transform: rotate(45deg);
      margin: 0 auto 25px;
      animation: pulse 1.4s infinite;
      box-shadow: 0 0 45px rgba(255, 77, 141, 0.8);
    }

    .big-heart::before,
    .big-heart::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      background: #ff4d8d;
      border-radius: 50%;
    }

    .big-heart::before { top: -80px; left: 0; }
    .big-heart::after { left: -80px; top: 0; }

    @keyframes pulse {
      0% { transform: rotate(45deg) scale(1); }
      50% { transform: rotate(45deg) scale(1.18); }
      100% { transform: rotate(45deg) scale(1); }
    }

    .love-text {
      font-size: 40px;
      letter-spacing: 4px;
      color: #ffd1e8;
      margin-bottom: 20px;
      text-shadow: 0 0 25px rgba(255, 105, 180, 0.8);
    }

    .poem {
      font-size: 18px;
      line-height: 1.8;
      color: #f3c6da;
      text-shadow: 0 0 15px rgba(255, 105, 180, 0.4);
      opacity: 0;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <div class="scene" id="letters"></div>

  <div class="scene" id="fullName">
    <div class="name" id="name"></div>
  </div>

  <div class="final" id="sceneFinal">
    <div class="big-heart"></div>
    <div class="love-text">I love you</div>
    <div class="poem" id="poem"></div>
  </div>

  <!-- Música de fondo -->
  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

  <script>
    const word = "ARIANA";
    const lettersScene = document.getElementById("letters");
    const fullName = document.getElementById("name");
    const poemEl = document.getElementById("poem");
    const music = document.getElementById("bgMusic");

    const poemText = `Nos miramos, tuve la sensación de que podía caer dentro de aquellos ojos.

Intenté correr, pero ya era muy tarde; mi corazón ya no estaba en mí, estaba en ti.

Y de vez en cuando intento hacerlo volver, pero cada vez prefiero más quedarme allá,
en el mismo lugar en el cual empecé a caer…

Justo en tu mirada.`;

    // Letras grandes, rápidas
    word.split("").forEach((char, index) => {
      setTimeout(() => {
        lettersScene.innerHTML = `<div class='single-letter'>${char}</div>`;
      }, index * 1000);
    });

    const lettersDuration = word.length * 1000;

    // Mostrar nombre completo
    setTimeout(() => {
      lettersScene.style.opacity = 0;
      fullName.textContent = word;
      document.getElementById("fullName").style.opacity = 1;
      fullName.style.opacity = 1;
    }, lettersDuration + 300);

    // Escena final + música
    setTimeout(() => {
      document.getElementById("fullName").style.opacity = 0;

      setTimeout(() => {
        document.getElementById("sceneFinal").style.opacity = 1;
        startMusic();
        typePoem();
      }, 2000);

    }, lettersDuration + 5000);

    // Música con fade-in (compatible con bloqueo autoplay)
    function startMusic() {
      music.volume = 0;
      music.play().then(() => {
        let v = 0;
        const fade = setInterval(() => {
          v += 0.02;
          music.volume = Math.min(v, 0.6);
          if (v >= 0.6) clearInterval(fade);
        }, 100);
      }).catch(() => {
        document.body.addEventListener('click', startMusic, { once: true });
      });
    }

    // Efecto escritura suave
    function typePoem() {
      poemEl.style.opacity = 1;
      poemEl.textContent = "";
      let i = 0;
      const speed = 28;

      const interval = setInterval(() => {
        poemEl.textContent += poemText.charAt(i);
        i++;
        if (i >= poemText.length) clearInterval(interval);
      }, speed);
    }
  </script>
</body>
</html>
